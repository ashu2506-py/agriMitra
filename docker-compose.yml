version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agri_mitra_postgres
    restart: always
    environment:
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: agri_password
      POSTGRES_DB: agri_mitra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_user -d agri_mitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agri_mitra_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri_mitra_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://agri_user:agri_password@postgres:5432/agri_mitra?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: dev_jwt_secret_agri_mitra
      JWT_REFRESH_SECRET: dev_refresh_secret_agri_mitra
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agri_mitra_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      AI_PORT: 8000
      USE_MOCK_AI_MODELS: "true"

volumes:
  postgres_data:
